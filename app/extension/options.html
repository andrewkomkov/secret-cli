<!doctype html>
<html data-i18n-title="settingsTitle">
<head>
  <meta charset="utf-8">
  <title>Secret Cookie Bridge: settings</title>
  <style>
    body { font: 14px -apple-system, sans-serif; margin: 20px; max-width: 480px; }
    label { display: block; margin-top: 12px; }
    input { font: inherit; width: 100%; box-sizing: border-box; }
    button { font: inherit; margin-top: 16px; padding: 6px 12px; }
    #status { margin-top: 10px; }
  </style>
</head>
<body>
  <h1 data-i18n="extName">Secret Cookie Bridge</h1>
  <label><span id="tokenLabel">Token (from secret cookie bridge token)</span>
    <input id="token" type="password" autocomplete="off">
  </label>
  <label><span data-i18n="nameLabel">Secret name (UPPER_SNAKE_CASE)</span>
    <input id="name" type="text" placeholder="SHOP_SESSION">
  </label>
  <label><span data-i18n="portLabel">Port</span>
    <input id="port" type="number" min="1" max="65535" value="17659">
  </label>
  <button id="save" data-i18n="saveButton">Save</button>
  <div id="status"></div>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
