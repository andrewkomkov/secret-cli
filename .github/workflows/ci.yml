name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 has the oldest Swift we support; macos-26 is close to the owner's toolchain.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax
        run: |
          for f in bin/secret install.sh hooks/install-claude.sh helper/store/build.sh app/build.sh tests/run.sh; do
            bash -n "$f"
          done
          perl -c hooks/claude-pretooluse.sh
          zsh -n completions/_secret

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -S warning bin/secret install.sh hooks/install-claude.sh \
            helper/*/build.sh app/build.sh app/extension/build.sh

      - name: Toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: SecretBar
        run: app/build.sh build

      - name: tests/run.sh
        run: tests/run.sh
