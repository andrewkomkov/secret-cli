name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Provenance for the tag tarball that the Homebrew formula downloads:
  #   gh attestation verify secret-X.Y.Z.tar.gz -R secretbar/secretbar
  attest:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download the tag tarball
        run: curl -fsSL --retry 5 -o "secret-$VERSION.tar.gz" "https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: secret-${{ needs.release-please.outputs.version }}.tar.gz

  # A tag made with GITHUB_TOKEN starts no other workflow, so the formula is updated here.
  formula:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: No key
        if: env.DEPLOY_KEY == ''
        run: echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set. Update url and sha256 in the tap by hand."

      - name: Update the tap
        if: env.DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" | base64 -d > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          url="https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          sha="$(curl -fsSL --retry 5 "$url" | sha256sum | cut -d' ' -f1)"
          git clone --depth 1 git@github.com:secretbar/homebrew-tap.git tap
          cd tap
          sed -i -E "s|^  url \".*\"$|  url \"$url\"|; s|^  sha256 \".*\"$|  sha256 \"$sha\"|" Formula/secretbar.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "secret $VERSION"
          git push
